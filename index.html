<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="pageTitle">Invoice Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:      #1a3a6b;
      --brand-dark: #122b52;
      --brand-light:#e8edf7;
      --danger:     #d63031;
      --success:    #00b894;
      --text:       #1a1a2e;
      --muted:      #666;
      --border:     #dde1ea;
      --surface:    #ffffff;
      --bg:         #f0f3f9;
      --radius:     8px;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Top bar ─────────────────────────────── */
    .topbar {
      background: var(--brand);
      color: white;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 12px rgba(26,58,107,.35);
    }

    .topbar-icon {
      width: 32px; height: 32px;
      background: rgba(255,255,255,.15);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    .topbar h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -.01em; }
    .topbar p  { font-size: 0.78rem; opacity: .65; margin-top: 1px; }

    .topbar-spacer { flex: 1; }

    /* ── Language toggle ─────────────────────── */
    .lang-toggle {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,.12);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s;
      background: transparent;
      color: rgba(255,255,255,.65);
      letter-spacing: .02em;
    }

    .lang-btn .flag { font-size: 1.1rem; line-height: 1; }

    .lang-btn.active {
      background: white;
      color: var(--brand);
    }

    .lang-btn:not(.active):hover {
      background: rgba(255,255,255,.15);
      color: white;
    }

    /* ── Layout ──────────────────────────────── */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    /* ── Card ────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
    }

    .card-title {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--brand);
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--brand-light);
    }

    /* ── Grid ────────────────────────────────── */
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .span2 { grid-column: 1 / -1; }

    /* ── Fields ──────────────────────────────── */
    .field { display: flex; flex-direction: column; gap: 5px; }

    label {
      font-size: 0.76rem;
      font-weight: 700;
      color: #444;
      letter-spacing: .01em;
    }

    input, textarea, select {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text);
      background: white;
      transition: border-color .15s, box-shadow .15s;
      appearance: none;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(26,58,107,.12);
    }

    textarea { resize: vertical; min-height: 72px; }

    /* ── Line items ──────────────────────────── */
    .li-header {
      display: grid;
      grid-template-columns: 3fr 90px 130px 32px;
      gap: 10px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .li-row {
      display: grid;
      grid-template-columns: 3fr 90px 130px 32px;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    .btn-remove {
      width: 32px; height: 36px;
      background: none;
      border: 1.5px solid var(--danger);
      color: var(--danger);
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
      flex-shrink: 0;
    }

    .btn-remove:hover { background: #fff0f0; }

    .btn-add-row {
      width: 100%;
      margin-top: 6px;
      padding: 9px;
      background: none;
      border: 1.5px dashed var(--brand);
      color: var(--brand);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }

    .btn-add-row:hover { background: var(--brand-light); }

    /* ── Submit button ───────────────────────── */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--brand);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .01em;
      transition: background .15s, transform .1s;
      margin-top: 4px;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--brand-dark);
      transform: translateY(-1px);
    }

    .btn-submit:active:not(:disabled) { transform: translateY(0); }

    .btn-submit:disabled {
      background: #8fa8cc;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Status banner ───────────────────────── */
    #status {
      display: none;
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-top: 20px;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    #status.loading {
      background: var(--brand-light);
      border: 1.5px solid var(--brand);
      color: var(--brand);
    }

    #status.success {
      background: #eafaf5;
      border: 1.5px solid var(--success);
      color: #006b4e;
    }

    #status.error {
      background: #fff0f0;
      border: 1.5px solid var(--danger);
      color: #922b21;
    }

    #status a { color: inherit; font-weight: 700; }

    /* ── Spinner ─────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ──────────────────────────── */
    @media (max-width: 640px) {
      .g2, .g3 { grid-template-columns: 1fr; }
      .span2 { grid-column: auto; }
      .li-header { display: none; }
      .li-row { grid-template-columns: 1fr 1fr; }
      .li-row input:first-child { grid-column: 1 / -1; }
      .lang-btn span:not(.flag) { display: none; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-icon">🔧</div>
    <div>
      <h1 data-i18n="pageTitle">Invoice Generator</h1>
      <p data-i18n="pageSubtitle">Fill in the details below and click Generate &amp; Send</p>
    </div>
    <div class="topbar-spacer"></div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">
        <span class="flag">🇬🇧</span><span>EN</span>
      </button>
      <button class="lang-btn" id="btn-fr" onclick="setLang('fr')">
        <span class="flag">🇫🇷</span><span>FR</span>
      </button>
    </div>
  </div>

  <div class="container">
    <form id="invoiceForm" novalidate>

      <!-- Invoice details -->
      <div class="card">
        <div class="card-title" data-i18n="cardInvoice">Invoice Details</div>
        <div class="g3">
          <div class="field">
            <label for="invoice_number" data-i18n="labelInvoiceNumber">Invoice Number *</label>
            <input type="text" id="invoice_number" data-i18n-ph="phInvoiceNumber" placeholder="INV-001" required>
          </div>
          <div class="field">
            <label for="invoice_date" data-i18n="labelInvoiceDate">Invoice Date *</label>
            <input type="date" id="invoice_date" required>
          </div>
          <div class="field">
            <label for="due_date" data-i18n="labelDueDate">Due Date *</label>
            <input type="date" id="due_date" required>
          </div>
        </div>
      </div>

      <!-- Customer information -->
      <div class="card">
        <div class="card-title" data-i18n="cardCustomer">Customer Information</div>
        <div class="g2">
          <div class="field">
            <label for="customer_name" data-i18n="labelName">Full Name *</label>
            <input type="text" id="customer_name" data-i18n-ph="phName" placeholder="John Murphy" required>
          </div>
          <div class="field">
            <label for="customer_email" data-i18n="labelEmail">Email Address *</label>
            <input type="email" id="customer_email" data-i18n-ph="phEmail" placeholder="john@example.com" required>
          </div>
          <div class="field span2">
            <label for="customer_address" data-i18n="labelAddress">Billing Address *</label>
            <textarea id="customer_address" data-i18n-ph="phAddress" placeholder="14 Oak Lane&#10;Dublin 6, D06 XY12" required></textarea>
          </div>
        </div>
      </div>

      <!-- Line items -->
      <div class="card">
        <div class="card-title" data-i18n="cardLineItems">Line Items</div>
        <div class="li-header">
          <span data-i18n="colDescription">Description</span>
          <span data-i18n="colQty">Qty</span>
          <span data-i18n="colPrice">Unit Price (€)</span>
          <span></span>
        </div>
        <div id="lineItems"></div>
        <button type="button" class="btn-add-row" id="btnAddRow" onclick="addRow()" data-i18n="btnAddRow">+ Add Line Item</button>
      </div>

      <!-- VAT & Notes -->
      <div class="card">
        <div class="card-title" data-i18n="cardVat">VAT &amp; Notes</div>
        <div class="g2">
          <div class="field">
            <label for="vat_rate" data-i18n="labelVatRate">VAT Rate (%)</label>
            <input type="number" id="vat_rate" value="21" min="0" max="100" step="0.1">
          </div>
          <div></div>
          <div class="field span2">
            <label for="notes" data-i18n="labelNotes">Notes / Payment Terms</label>
            <textarea id="notes" data-i18n-ph="phNotes" placeholder="Payment due within 30 days. Bank transfer to IBAN IE29 AIBK 9311 5212 3456 78."></textarea>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn" data-i18n="btnSubmit">
        Generate &amp; Send Invoice
      </button>

    </form>

    <div id="status"></div>
  </div>

  <script>
    // ── Translations ──────────────────────────────────────────────────────────
    const i18n = {
      en: {
        pageTitle:        "Invoice Generator",
        pageSubtitle:     "Fill in the details below and click Generate & Send",
        cardInvoice:      "Invoice Details",
        labelInvoiceNumber: "Invoice Number *",
        labelInvoiceDate: "Invoice Date *",
        labelDueDate:     "Due Date *",
        cardCustomer:     "Customer Information",
        labelName:        "Full Name *",
        labelEmail:       "Email Address *",
        labelAddress:     "Billing Address *",
        cardLineItems:    "Line Items",
        colDescription:   "Description",
        colQty:           "Qty",
        colPrice:         "Unit Price (€)",
        btnAddRow:        "+ Add Line Item",
        cardVat:          "VAT & Notes",
        labelVatRate:     "VAT Rate (%)",
        labelNotes:       "Notes / Payment Terms",
        btnSubmit:        "Generate & Send Invoice",
        sending:          "Generating PDF and sending invoice — this takes a few seconds…",
        btnSending:       "Sending…",
        successTitle:     "✓ Invoice sent successfully!",
        successDelivered: "Invoice #{num} delivered to {email}",
        driveLink:        "View PDF in Google Drive",
        errNetwork:       "Network error:",
        errGeneric:       "Error:",
        phInvoiceNumber:  "INV-001",
        phName:           "John Murphy",
        phEmail:          "john@example.com",
        phAddress:        "14 Oak Lane\nDublin 6, D06 XY12",
        phNotes:          "Payment due within 30 days. Bank transfer to IBAN IE29 AIBK 9311 5212 3456 78.",
        phDesc:           "e.g. Replace kitchen tap",
      },
      fr: {
        pageTitle:        "Générateur de Factures",
        pageSubtitle:     "Remplissez les champs ci-dessous et cliquez sur Générer & Envoyer",
        cardInvoice:      "Détails de la Facture",
        labelInvoiceNumber: "Numéro de Facture *",
        labelInvoiceDate: "Date de Facture *",
        labelDueDate:     "Date d'Échéance *",
        cardCustomer:     "Informations Client",
        labelName:        "Nom Complet *",
        labelEmail:       "Adresse Email *",
        labelAddress:     "Adresse de Facturation *",
        cardLineItems:    "Lignes de Facturation",
        colDescription:   "Description",
        colQty:           "Qté",
        colPrice:         "Prix Unitaire (€)",
        btnAddRow:        "+ Ajouter une ligne",
        cardVat:          "TVA & Notes",
        labelVatRate:     "Taux de TVA (%)",
        labelNotes:       "Notes / Conditions de Paiement",
        btnSubmit:        "Générer & Envoyer la Facture",
        sending:          "Génération du PDF et envoi de la facture en cours…",
        btnSending:       "Envoi…",
        successTitle:     "✓ Facture envoyée avec succès !",
        successDelivered: "Facture #{num} envoyée à {email}",
        driveLink:        "Voir le PDF sur Google Drive",
        errNetwork:       "Erreur réseau :",
        errGeneric:       "Erreur :",
        phInvoiceNumber:  "FAC-001",
        phName:           "Jean Dupont",
        phEmail:          "jean@exemple.fr",
        phAddress:        "14 Rue des Chênes\n75001 Paris",
        phNotes:          "Paiement sous 30 jours. Virement bancaire sur IBAN FR76 3000 6000 0112 3456 7890 189.",
        phDesc:           "ex. Remplacement robinet cuisine",
      },
    };

    let currentLang = "en";

    function setLang(lang) {
      currentLang = lang;
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
      document.documentElement.lang = lang;
      applyTranslations();
    }

    function applyTranslations() {
      const t = i18n[currentLang];

      // Text content
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (t[key] !== undefined) el.textContent = t[key];
      });

      // Placeholders
      document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const key = el.dataset.i18nPh;
        if (t[key] !== undefined) el.placeholder = t[key];
      });

      // Update existing line item placeholders
      document.querySelectorAll('.li-desc').forEach(el => {
        el.placeholder = t.phDesc;
      });

      // Page title
      document.title = t.pageTitle;
    }

    // ── Initialise ────────────────────────────────────────────────────────────
    (function () {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('invoice_date').value = today;

      const due = new Date();
      due.setDate(due.getDate() + 30);
      document.getElementById('due_date').value = due.toISOString().split('T')[0];

      addRow();
    })();

    // ── Line item rows ────────────────────────────────────────────────────────
    function addRow() {
      const t = i18n[currentLang];
      const container = document.getElementById('lineItems');
      const div = document.createElement('div');
      div.className = 'li-row';
      div.innerHTML = `
        <input type="text"   class="li-desc"  placeholder="${t.phDesc}" required>
        <input type="number" class="li-qty"   placeholder="1"    min="0.01" step="0.01" value="1" required>
        <input type="number" class="li-price" placeholder="0.00" min="0"    step="0.01" required>
        <button type="button" class="btn-remove" onclick="this.closest('.li-row').remove()" title="×">×</button>
      `;
      container.appendChild(div);
      div.querySelector('.li-desc').focus();
    }

    function getLineItems() {
      return Array.from(document.querySelectorAll('.li-row')).map(row => ({
        description: row.querySelector('.li-desc').value.trim(),
        quantity:    parseFloat(row.querySelector('.li-qty').value)   || 0,
        unit_price:  parseFloat(row.querySelector('.li-price').value) || 0,
      }));
    }

    // ── Status helper ─────────────────────────────────────────────────────────
    function showStatus(type, html) {
      const el = document.getElementById('status');
      el.className = type;
      el.innerHTML = html;
      el.style.display = 'block';
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ── Form submit ───────────────────────────────────────────────────────────
    document.getElementById('invoiceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const t = i18n[currentLang];

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span>${t.btnSending}`;

      showStatus('loading', `<span class="spinner"></span>${t.sending}`);

      const payload = {
        invoice_number:   document.getElementById('invoice_number').value.trim(),
        invoice_date:     document.getElementById('invoice_date').value,
        due_date:         document.getElementById('due_date').value,
        customer_name:    document.getElementById('customer_name').value.trim(),
        customer_email:   document.getElementById('customer_email').value.trim(),
        customer_address: document.getElementById('customer_address').value.trim(),
        line_items:       getLineItems(),
        vat_rate:         parseFloat(document.getElementById('vat_rate').value) || 0,
        notes:            document.getElementById('notes').value.trim(),
        language:         currentLang,
      };

      try {
        const res  = await fetch('/api/invoices/send', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(payload),
        });
        const data = await res.json();

        if (res.ok) {
          const driveUrl = data.steps?.drive?.file_url;
          const driveLink = driveUrl
            ? `<br>📄 <a href="${driveUrl}" target="_blank">${t.driveLink}</a>`
            : '';

          const deliveredMsg = t.successDelivered
            .replace('{num}', data.invoice_number)
            .replace('{email}', payload.customer_email);

          showStatus('success',
            `<strong>${t.successTitle}</strong><br>${deliveredMsg}${driveLink}`
          );

          // Reset form
          e.target.reset();
          document.getElementById('lineItems').innerHTML = '';
          addRow();

          // Restore default dates
          const today = new Date().toISOString().split('T')[0];
          document.getElementById('invoice_date').value = today;
          const due = new Date(); due.setDate(due.getDate() + 30);
          document.getElementById('due_date').value = due.toISOString().split('T')[0];
          document.getElementById('vat_rate').value = '21';

        } else {
          const msg = data.detail || JSON.stringify(data);
          showStatus('error', `<strong>${t.errGeneric}</strong> ${msg}`);
        }
      } catch (err) {
        showStatus('error', `<strong>${t.errNetwork}</strong> ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = t.btnSubmit;
      }
    });
  </script>
</body>
</html>
